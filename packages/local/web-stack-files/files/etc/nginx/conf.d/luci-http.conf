# 局域网 80 端口：301 跳转到 https（443 由 nginx-util 的 _lan 提供，用自签证书）。
# 想改回「80 直接提供 LuCI」，把 return 换成 include /etc/nginx/conf.d/luci.locations; 即可。
# 该文件属于 web-stack-files；反代插件只写 conf.d/proxy.d，改坏那边不影响这条入口。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
    access_log off;
}
