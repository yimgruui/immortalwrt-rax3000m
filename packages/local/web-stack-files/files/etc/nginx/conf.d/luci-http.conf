# 局域网 80 端口：直接提供 LuCI（HTTP），不做 80→443 跳转。
# 内网没有公网证书，强制 https 只会让浏览器每次报警；需要 TLS 时用 luci-app-nginx-proxy 配。
# 该文件属于 web-stack-files，反代插件只写 conf.d/proxy.d，改坏那边也不影响这条入口。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/conf.d/luci.locations;

    access_log off;
}
