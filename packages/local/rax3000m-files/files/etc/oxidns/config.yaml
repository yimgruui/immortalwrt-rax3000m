# OxiDNS 运行时配置（lite 方案 · 1.7.1 · 单 DoH 防429版）
#
# 功能保留：广告拦截、规则自动更新、WebUI、指标采集、单缓存、全 DoH 主用。
# 防429核心：forward_main 仅保留阿里 DoH，上游请求量与客户端查询量基本持平。
# 部署位置：/etc/oxidns/config.yaml
# 修改后：oxidns check -c /etc/oxidns/config.yaml && /etc/init.d/oxidns restart

log:
  level: info
  file: ./oxidns.log
  rotation:
    type: daily
    max_files: 3

api:
  http:
    listen: 192.168.11.1:9199
    webui:
      root: /usr/share/oxidns/webui

plugins:
  # ==================== 规则自动更新 ====================
  - tag: cron_update
    type: cron
    args:
      timezone: Asia/Shanghai
      jobs:
        - name: update_ads
          interval: 24h
          executors:
            - $download_ads
            - $reload_ads

  - tag: download_ads
    type: download
    args:
      timeout: 180s
      startup_if_missing: true
      downloads:
        - url: https://anti-ad.net/adguard.txt
          dir: /etc/oxidns/rules
          filename: antiad.txt

  - tag: reload_ads
    type: reload_provider
    args:
      - $ad_rules

  # ==================== 广告规则 Provider ====================
  - tag: ad_rules
    type: adguard_rule
    args:
      files:
        - /etc/oxidns/rules/antiad.txt

  # ==================== 命中即 REFUSED ====================
  - tag: ad_blackhole
    type: black_hole
    args:
      mode: refused
      short_circuit: true

  # ==================== 指标 ====================
  - tag: metrics_main
    type: metrics_collector
    args:
      name: home

  # ==================== 单缓存 ====================
  - tag: cache_main
    type: cache
    args:
      size: 8192
      short_circuit: true
      lazy_cache_ttl: 3600
      cache_negative: true
      max_negative_ttl: 30
      negative_ttl_without_soa: 10
      ecs_in_key: false
      dump_file: /etc/oxidns/rules/dns_cache_lite.dump
      dump_interval: 1800

  # ==================== 主用 forward：仅阿里 DoH，单上游 ====================
  # 只有一个 upstream 时，OxiDNS 自动使用单上游转发器；
  # concurrent 和 response_selection 均不参与实际转发决策，保留 concurrent: 1 语义清晰即可。
  - tag: forward_main
    type: forward
    args:
      concurrent: 1
      upstreams:
        - tag: doh_alibaba
          addr: "https://dns.alidns.com/dns-query"
          dial_addr: "223.5.5.5"
          timeout: 5s

  # ==================== 显式兜底（保留 UDP，非 DoH）====================
  - tag: forward_backup
    type: forward
    args:
      concurrent: 1
      upstreams:
        - tag: udp_volcengine_backup
          addr: "180.184.1.1:53"
          timeout: 5s

  # ==================== fallback：备用路径仅在主路径失败/超时后启动 ====================
  - tag: fallback_main
    type: fallback
    args:
      primary: "forward_main"
      secondary: "forward_backup"
      threshold: 300
      always_standby: false

  # ==================== TTL 钳制 ====================
  - tag: ttl_main
    type: ttl
    args:
      min: 60
      max: 600

  # ==================== 主序列 ====================
  - tag: main_sequence
    type: sequence
    args:
      - matches: "qname $ad_rules"
        exec: $ad_blackhole
      - exec: $cache_main
      - matches: "has_resp"
        exec: accept
      - exec: $fallback_main
      - matches: "has_resp"
        exec: $ttl_main
      - exec: accept

  # ==================== 监听（双栈）====================
  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: ":5335"

  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: ":5335"
