# 预置内核锁：这些二进制在构建期下载并打进镜像，刷完即用，不依赖设备侧访问 GitHub。
# 语法为 KEY=VALUE，供 scripts/fetch-cores.sh `source`。
#
# 版本升级后建议把 SHA256 填上（空值 = 只记录不校验）。获取方式：
#   curl -L <asset_url> | sha256sum
# 填上之后，上游替换同名资源会立刻让构建失败，而不是悄悄打进一个不同的二进制。

# --- oxidns：aarch64 + musl，bundle 必须是 standard 才能跑 features/ 里定的 lite 配置 ---
OXIDNS_VERSION=1.6.1
OXIDNS_BUNDLE=standard
OXIDNS_ASSET=oxidns-standard-aarch64-unknown-linux-musl.tar.gz
OXIDNS_SHA256=2ec28c54b3668216221ad07c32ecf6e63a5ad24d3ffcdde04f8dda7e8896908d

# --- pcdn-detector：C 版（体积 0.38MB、无常驻 GC），与 TOML 中“C 版本没有 GC”的说明对应 ---
PCDN_REPO=Womsxd/pcdn-detector-c
PCDN_VERSION=v0.0.1-beta.2
PCDN_ASSET=pcdn-detect-arm64
PCDN_SHA256=

# 可选 GitHub 加速前缀，例如 https://ghfast.top
# 只影响构建期下载；留空则直连。
GITHUB_MIRROR=${GITHUB_MIRROR:-}
