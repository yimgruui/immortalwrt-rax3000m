name: debug-pkg

# 临时调试：只编一个包并打印完整错误（build 的 -j 输出会把子 make 的错误吞掉）。
# 用完即删。
on:
  workflow_dispatch:
    inputs:
      pkg:
        description: '包路径，如 package/local/rax3000m-files'
        type: string
        default: 'package/local/rax3000m-files'

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget libelf-dev
          sudo mkdir -p /workdir && sudo chown $USER:$GROUPS /workdir

      - name: 预置资源
        run: |
          bash scripts/fetch-cores.sh
          bash scripts/fetch-geodata.sh

      - name: 准备源码
        run: |
          bash scripts/prepare.sh --commit "$(sed -n 's/^UPSTREAM_COMMIT=//p' targets/rax3000m-nand.conf)"

      - name: 生成配置
        run: |
          python3 scripts/genconfig.py --target targets/rax3000m-nand.conf \
            --series features/series --features-dir features \
            --out openwrt/.config --expected build-artifacts/expected-packages.txt
          cd openwrt && make defconfig

      - name: 构建主机工具
        run: |
          cd openwrt
          make tools/install -j"$(nproc)" 2>&1 | tail -15

      - name: 只编目标包（V=s）
        continue-on-error: true
        run: |
          cd openwrt
          set +e
          echo "===== clean ====="
          make "${{ inputs.pkg }}/clean" V=s 2>&1 | tail -30
          echo "===== compile ====="
          make "${{ inputs.pkg }}/compile" V=s 2>&1 | tail -80
          echo "===== install ====="
          make "${{ inputs.pkg }}/install" V=s 2>&1 | tail -80
          echo "===== package ====="
          make "${{ inputs.pkg }}/package" V=s 2>&1 | tail -40

      - name: 失败时导出 OpenWrt 包日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-logs
          path: openwrt/logs/**
          if-no-files-found: ignore
          retention-days: 3
