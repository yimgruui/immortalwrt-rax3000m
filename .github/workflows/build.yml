name: build

# 单变体：一次构建产出一个固件。没有定时器，只在“有变化”时跑：
#   * bump-external 检测到基座新提交 → 自动 dispatch（GITHUB_TOKEN 的 push 不触发工作流）；
#   * 合并依赖升级 PR → push 命中 locks/**；
#   * 改特性片段 / 本地包 / 脚本 → push 命中对应路径；
#   * 手动 workflow_dispatch。
on:
  workflow_dispatch:
    inputs:
      base_commit:
        description: '复现历史构建时填当时的 commit（留空=用 targets 里钉住的值）'
        required: false
      clean_build:
        description: '不使用编译缓存（全量重编）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'targets/**'
      - 'features/**'
      - 'packages/**'
      - 'locks/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘并安装依赖
        run: |
          df -hT /home
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget libelf-dev
          avail=$(df --output=avail -BG /home | tail -1 | tr -dc '0-9')
          echo "可用空间: ${avail}G"
          [ "${avail:-0}" -ge 25 ] || { echo "::error::磁盘不足，需要至少 25G"; exit 1; }

      - name: 解析基座 commit
        id: base
        env:
          OVERRIDE: ${{ inputs.base_commit }}
        run: |
          repo=$(sed -n 's/^UPSTREAM_REPO=//p' targets/rax3000m-nand.conf)
          branch=$(sed -n 's/^UPSTREAM_BRANCH=//p' targets/rax3000m-nand.conf)
          pinned=$(sed -n 's/^UPSTREAM_COMMIT=//p' targets/rax3000m-nand.conf)
          if [ -n "$OVERRIDE" ]; then
            commit="$OVERRIDE"
          elif [ -n "$pinned" ]; then
            commit="$pinned"
          else
            commit=""
            for i in 1 2 3; do
              commit=$(git ls-remote "$repo" "refs/heads/$branch" | awk '{print $1}' || true)
              [ -n "$commit" ] && break
              echo "第 $i 次获取 HEAD 失败，5s 后重试"
              sleep 5
            done
            [ -n "$commit" ] || { echo "::error::拿不到 $repo 的 $branch HEAD（网络问题？）"; exit 1; }
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "short=$(printf '%s' "$commit" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "基座: $repo @ $branch → $commit"

      - name: 下载预置资源（内核 + geo 数据）
        run: bash scripts/fetch-assets.sh
        env:
          GITHUB_MIRROR: ${{ vars.GITHUB_MIRROR }}

      - name: 准备源码（基座/feeds/外部包/本地包）并计算工具链签名
        id: prepare
        run: bash scripts/prepare.sh --commit "${{ steps.base.outputs.commit }}"

      # 缓存按“工具链签名”分桶：签名不变就复用（只重编变动的包），
      # 签名变了才全新编译，绝不把旧工具链带过来。
      - name: 恢复编译缓存
        id: stage
        if: inputs.clean_build != true
        uses: actions/cache/restore@v4
        with:
          path: openwrt/staging_dir
          key: owrt-stage-${{ steps.prepare.outputs.sig }}-${{ hashFiles('features/**','targets/**','locks/**','scripts/**') }}
          restore-keys: |
            owrt-stage-${{ steps.prepare.outputs.sig }}-

      - name: 生成 .config 并校验
        run: |
          mkdir -p build-artifacts
          python3 scripts/genconfig.py \
            --target targets/rax3000m-nand.conf \
            --series features/series \
            --features-dir features \
            --out openwrt/.config \
            --expected build-artifacts/expected-packages.txt
          ( cd openwrt && make defconfig )
          python3 scripts/verify.py check-config \
            --config openwrt/.config \
            --expected build-artifacts/expected-packages.txt
          python3 scripts/verify.py check-coverage \
            --dirs packages/local --config openwrt/.config

      - name: 下载源码包
        run: |
          cd openwrt
          make download -j8
          # 只看 dl/ 顶层：包压缩包都在这一层；go-mod-cache 里有大量合法的几十字节文件。
          bad=$(find dl -maxdepth 1 -type f \( -name '*.tar.*' -o -name '*.zip' -o -name '*.gz' \) -size -1024c)
          if [ -n "$bad" ]; then
            echo "::error::存在小于 1KB 的压缩包下载，可能已损坏："
            echo "$bad"
            exit 1
          fi

      - name: 编译
        run: |
          cd openwrt
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: 校验产物并生成发布物
        run: |
          python3 scripts/verify.py check-image \
            --bin openwrt/bin/targets/mediatek/filogic \
            --expected build-artifacts/expected-packages.txt \
            --dist dist \
            --commit "${{ steps.base.outputs.commit }}" \
            --upstream-repo "$(sed -n 's/^UPSTREAM_REPO=//p' targets/rax3000m-nand.conf)" \
            --upstream-branch "$(sed -n 's/^UPSTREAM_BRANCH=//p' targets/rax3000m-nand.conf)" \
            --features "$(grep -v '^#' features/series | grep -v '^$' | paste -sd, -)"

      - name: 保存编译缓存
        if: success() && inputs.clean_build != true && steps.stage.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: openwrt/staging_dir
          key: ${{ steps.stage.outputs.cache-primary-key }}

      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/**
          retention-days: 14

      - name: 失败时定位（V=s 重跑 + 保留现场）
        if: failure()
        run: |
          cd openwrt
          echo "===== V=s 重跑 rax3000m-files ====="
          make package/local/rax3000m-files/compile V=s 2>&1 | tail -120 || true

      - name: 失败时上传现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-debug
          path: |
            openwrt/build.log
            openwrt/logs/**
            openwrt/bin/targets/**/*.itb
            openwrt/bin/targets/**/*.manifest
          if-no-files-found: ignore
          retention-days: 3

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - name: 生成 tag
        id: meta
        run: echo "tag=$(TZ=Asia/Shanghai date +%Y.%m.%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: dist/release-notes.md
          files: dist/*

      - name: 清理旧 Release（保留 5 个）
        uses: gzk47/delete-older-releases@v0.3.5
        with:
          keep_latest: 5
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
