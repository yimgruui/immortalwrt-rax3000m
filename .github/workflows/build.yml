name: build

# 单变体：一次构建产出一个固件。
#
# 没有定时器——只在“有变化”时构建：
#   * bump-external 检测到基座有新提交 → 自动 dispatch（GITHUB_TOKEN 的 push 不触发工作流）；
#   * 合并外部依赖/内核的 bump PR → push 命中 locks/**；
#   * 改特性片段 / 本地包 / 补丁 / 脚本 → push 命中对应路径；
#   * 手动 workflow_dispatch。
on:
  workflow_dispatch:
    inputs:
      base_commit:
        description: '复现历史构建时填当时的 commit（留空=用 targets 里钉住的值）'
        required: false
      clean_build:
        description: '不复用依赖下载缓存'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'targets/**'
      - 'features/**'
      - 'packages/**'
      - 'locks/**'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘并安装依赖
        run: |
          df -hT /home
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget libelf-dev
          avail=$(df --output=avail -BG /home | tail -1 | tr -dc '0-9')
          echo "可用空间: ${avail}G"
          [ "${avail:-0}" -ge 25 ] || { echo "::error::磁盘不足，需要至少 25G"; exit 1; }

      - name: 解析本次基座 commit
        id: base
        env:
          OVERRIDE: ${{ inputs.base_commit }}
        run: |
          repo=$(sed -n 's/^UPSTREAM_REPO=//p' targets/rax3000m-nand.conf)
          branch=$(sed -n 's/^UPSTREAM_BRANCH=//p' targets/rax3000m-nand.conf)
          if [ -n "$OVERRIDE" ]; then
            commit="$OVERRIDE"
            echo "使用指定 commit（复现历史构建）"
          elif [ -n "$(sed -n 's/^UPSTREAM_COMMIT=//p' targets/rax3000m-nand.conf)" ]; then
            commit=$(sed -n 's/^UPSTREAM_COMMIT=//p' targets/rax3000m-nand.conf)
            echo "使用 targets 里钉住的 commit"
          else
            commit=""
            for i in 1 2 3; do
              commit=$(git ls-remote "$repo" "refs/heads/$branch" | awk '{print $1}' || true)
              [ -n "$commit" ] && break
              echo "第 $i 次获取 HEAD 失败，5s 后重试"
              sleep 5
            done
            [ -n "$commit" ] || { echo "::error::拿不到 $repo 的 $branch HEAD（网络问题？）"; exit 1; }
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "short=$(printf '%s' "$commit" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "基座: $repo @ $branch → $commit"

      - name: 恢复下载缓存
        if: inputs.clean_build != true
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: owrt-dl-${{ hashFiles('targets/**','features/**','packages/**','patches/**') }}
          restore-keys: |
            owrt-dl-

      - name: 下载预置内核
        run: bash scripts/fetch-cores.sh
        env:
          GITHUB_MIRROR: ${{ vars.GITHUB_MIRROR }}

      - name: 准备源码（基座/feeds/外部包/补丁）
        run: bash scripts/prepare.sh --commit "${{ steps.base.outputs.commit }}"

      # 基座是 rebase 分支，每周更新都会改写 commit——用它当缓存维度等于每次都 miss。
      # 工具链兼容性只取决于 toolchain/ 与 key include 文件，所以按内容签名分桶：
      #   签名不变（绝大多数上游提交）→ 直接复用，只重编变动的包；
      #   签名变了（工具链真的换了）→ 全新编译，绝不串用旧工具链。
      - name: 计算工具链签名
        id: tc
        run: |
          sig=$(cd openwrt && find toolchain include/toolchain.mk rules.mk -type f -print0 \
                | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "sig=${sig:0:16}" >> "$GITHUB_OUTPUT"
          echo "工具链签名: ${sig:0:16}"

      - name: 恢复编译缓存
        id: stage
        if: inputs.clean_build != true
        uses: actions/cache/restore@v4
        with:
          path: openwrt/staging_dir
          key: owrt-stage-${{ steps.tc.outputs.sig }}-${{ hashFiles('features/**','targets/**','locks/**','patches/**','scripts/**') }}
          restore-keys: |
            owrt-stage-${{ steps.tc.outputs.sig }}-

      - name: 生成 .config 并校验必需包
        run: |
          mkdir -p build-artifacts
          python3 scripts/genconfig.py \
            --target targets/rax3000m-nand.conf \
            --series features/series \
            --features-dir features \
            --out openwrt/.config \
            --expected build-artifacts/expected-packages.txt
          ( cd openwrt && make defconfig )
          python3 scripts/verify.py check-config \
            --config openwrt/.config \
            --expected build-artifacts/expected-packages.txt
          # 本地包目录存在却忘了启用（本次 rax3000m-files 的教训）
          python3 scripts/verify.py check-coverage \
            --dirs packages/local --config openwrt/.config

      - name: 下载源码包
        run: |
          cd openwrt
          make download -j8
          if find dl -size -1024c | grep -q .; then
            echo "::error::存在小于 1KB 的损坏下载："
            find dl -size -1024c
            exit 1
          fi

      - name: 编译
        run: |
          cd openwrt
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: 校验产物并生成发布物
        run: |
          python3 scripts/verify.py check-image \
            --bin openwrt/bin/targets/mediatek/filogic \
            --expected build-artifacts/expected-packages.txt \
            --dist dist \
            --variant full \
            --commit "${{ steps.base.outputs.commit }}" \
            --upstream-repo "$(sed -n 's/^UPSTREAM_REPO=//p' targets/rax3000m-nand.conf)" \
            --upstream-branch "$(sed -n 's/^UPSTREAM_BRANCH=//p' targets/rax3000m-nand.conf)" \
            --features "$(grep -v '^#' features/series | grep -v '^$' | paste -sd, -)"

      - name: 保存下载缓存
        if: success() && inputs.clean_build != true
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: owrt-dl-${{ hashFiles('targets/**','features/**','packages/**','patches/**') }}

      - name: 保存编译缓存
        if: success() && inputs.clean_build != true && steps.stage.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: openwrt/staging_dir
          key: ${{ steps.stage.outputs.cache-primary-key }}

      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/**
          retention-days: 14

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 失败时保留原始产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raw-artifacts
          path: |
            openwrt/bin/targets/**/*.itb
            openwrt/bin/targets/**/*.manifest
            openwrt/bin/targets/**/*.buildinfo
          if-no-files-found: ignore
          retention-days: 3

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - name: 生成 tag
        id: meta
        run: echo "tag=$(TZ=Asia/Shanghai date +%Y.%m.%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: dist/release-notes.md
          files: dist/*

      - name: 清理旧 Release（保留 5 个）
        uses: gzk47/delete-older-releases@v0.3.5
        with:
          keep_latest: 5
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
