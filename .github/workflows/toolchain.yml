name: toolchain

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: 0 20 3,18 * * 

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  CONFIG_FILE: config/rax3000m-nginx.config
  DIY_SH: sh/diy-rax3000m.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检查分支
      uses: actions/checkout@v6
      
    - name: 释放磁盘空间
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h

    - name: 编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libfuse-dev clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget \
          libelf-dev qemu-utils ccache
        sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 克隆源代码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        ./scripts/feeds update -a && ./scripts/feeds install -a
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 加载自定义脚本
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_SH

    - name: 下载编译依赖
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译源码
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: 删除旧缓存
      run: |
        CACHE_IDS=$(gh cache list --key openwrt-toolchain-cache --limit 10 --json id --jq '.[].id')
        if [ -n "$CACHE_IDS" ]; then
          echo "$CACHE_IDS" | xargs -I {} gh cache delete {}
          echo "已删除缓存 ID: $CACHE_IDS"
        else
          echo "未找到匹配的缓存"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
    - name: 清理缓存
      run: |
        cd openwrt
        make clean

    - name: 缓存 staging_dir
      uses: actions/cache@v5
      with:
        path: |
          openwrt/staging_dir
        key: openwrt-toolchain-cache
        restore-keys: |
          openwrt-toolchain-cache
