name: immo-rax3000m

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: 0 22 * * 6 

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  CONFIG_FILE: config/rax3000m-nginx.config
  DIY_SH: sh/diy-rax3000m.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检查分支
      uses: actions/checkout@v6
      
    - name: 释放磁盘空间
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h

    - name: 编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libfuse-dev clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget \
          libelf-dev qemu-utils ccache
        sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime

    - name: 克隆源代码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        ./scripts/feeds update -a && ./scripts/feeds install -a
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 取回缓存 staging_dir
      uses: actions/cache@v5
      with:
        path: |
          openwrt/staging_dir
        key: openwrt-toolchain-cache
        restore-keys: |
          openwrt-toolchain-cache

    - name: 加载自定义脚本
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_SH
        cd openwrt
        find ./staging_dir/ -name '*' -exec touch {} \; >/dev/null 2>&1
        $GITHUB_WORKSPACE/$DIY_SH

    - name: 下载编译依赖
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译源码
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: 查看磁盘使用情况
      if: (!cancelled())
      run: df -hT

    - name: 整理文件
      id: organize
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        rm -rf feeds.buildinfo
        rm -rf version.buildinfo
        rm -rf profiles.json
        rm -rf *.manifest
        rm -rf *.bin
        rm -rf *.fip
        rm -rf *.sha
        rm -rf sha256sums
        mv config.buildinfo rax3000m.buildinfo
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: 生成发布标签
      id: tag
      run: |
        echo "release_tag=$(date +"%Y.%m.%d")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "默认ip：192.168.11.1" >> release.txt
        echo "默认密码：无" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件到Releases
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2.1.0
      with:
        retain_days: 0
        keep_minimum_runs: 0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Remove old Releases
      uses: gzk47/delete-older-releases@v0.3.5
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
