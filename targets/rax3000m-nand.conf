# 目标机型：中国移动 RAX3000M（NAND 版，128MB flash / 256MB RAM，MT7981B）
#
# 语法为 KEY=VALUE，可被 shell `source`，也被 scripts/genconfig.py 读取。
# 注意：RAX3000M 有 NAND 与 eMMC 两个硬件版本，本文件只适用于 NAND（cmcc_rax3000m）。
#       刷入 eMMC 版会变砖。

TARGET_NAME=rax3000m-nand

# 上游基座：MT7981 私有 WiFi 驱动（mt_wifi）与硬件加速（HNAT/WARP）只在该 fork 中提供。
#
# 基座钉 commit：bump-external 每天检查上游分支，有新提交就更新下面这个值，
# 然后直接拉起一次 build（产物里的 build-manifest.json 会记录实际使用的 SHA）。
#   * 留空则退化为“构建时跟随分支 HEAD”，仅作为应急手段；
#   * 上游改动导致构建失败时不发版，Release 仍保留上一版，下次检测会继续跟进新提交。
UPSTREAM_REPO=https://github.com/chasey-dev/immortalwrt-mt798x-rebase
UPSTREAM_BRANCH=25.12
UPSTREAM_COMMIT=9f397975c7b47ce6986a6e39529d2f72fd5c729d

# 设备三元组，由 genconfig.py 写到 .config 头部。
DEVICE_TARGET=CONFIG_TARGET_mediatek
DEVICE_SUBTARGET=CONFIG_TARGET_mediatek_filogic
DEVICE_PROFILE=CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m

# 产物匹配与体积上限（sysupgrade.itb 当前约 45MB，120MB 是给未来加包留的余量）。
IMAGE_GLOB=*sysupgrade.itb
RECOVERY_GLOB=*recovery.itb
SIZE_MAX_MB=120

# 文档用：默认管理地址。
LAN_IP=192.168.11.1
