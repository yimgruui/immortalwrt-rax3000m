# 外部包锁：每个包钉死 commit，clone 失败或 commit 不存在直接让构建失败。
# 语法为 KEY=VALUE，供 scripts/prepare.sh `source`。
# 可选 PKG_n_SUBDIR：插件仓库是多包仓库时，只取该子目录。
# 升级方式：`tools/bump-external.sh` 或 bump-external 工作流（每天检查）→ build 绿了再合并。

COUNT=4

PKG_1_NAME=openwrt-nikki
PKG_1_REPO=https://github.com/nikkinikki-org/OpenWrt-nikki
PKG_1_COMMIT=aaf46bf02a9ab2b5a8ab3fcaa5f84c99e56585bf
PKG_1_DEST=package/new/OpenWrt-nikki

PKG_2_NAME=luci-app-pcdn-detector
